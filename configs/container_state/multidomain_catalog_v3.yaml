version: 3

# Each entry is a small, hand-authored world rather than a noun substitution.
# `train` surfaces are used by train/IID/template-OOD. `validation` surfaces
# are used by lexical-OOD and compositional-OOD.
training_domains:
  - id: zoo
    setting: the city zoo
    agents: [Amara, Ben, Cora, Dinesh]
    containers:
      train: [otter habitat, panda enclosure, lemur shelter, crane pen, tortoise yard, fox den]
      validation: [meerkat burrow, tapir stall, ibis aviary, lynx habitat, capybara pool, badger lodge]
    objects:
      train: [bamboo bundle, feeding bowl, rope toy, nesting mat, water tub, mineral block, keeper brush, fruit tray, shade cloth, medicine pouch, wooden perch, enrichment ball]
      validation: [reed bundle, grooming comb, seed hopper, scent cloth, cooling stone, hay rack, keeper glove, puzzle feeder, climbing branch, salt lick, bedding roll, transport sling]
    verbs: {add: delivered, remove: collected, move: transferred}
  - id: warehouse
