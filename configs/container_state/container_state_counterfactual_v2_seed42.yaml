name: container_state_counterfactual_v2_seed42
seed: 42
output_dir: data/container_state/container_state_counterfactual_v2_seed42
lexicons: configs/container_state/lexicons_v1.yaml
pool_min_words: 130000
eval_pairs: 1000

world:
  container_count_weights:
    3: 0.5
    4: 0.3
    5: 0.2
  min_items_per_container: 2
  max_items_per_container: 3
  same_type_ratio: 0.5

operations:
  # A shared prefix gives one-, two-, and three-event tracking examples.
  common_count_weights:
    0: 0.34
    1: 0.33
    2: 0.33
  common_kind_weights:
    add: 0.333333
    remove: 0.333333
    move: 0.333334

rendering:
  training_templates:
    - household_narrative
    - inventory_report
    - cleanup_summary
    - conversational_recap
  heldout_templates:
    - storage_log
    - observational_report
