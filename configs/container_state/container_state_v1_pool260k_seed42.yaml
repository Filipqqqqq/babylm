name: container_state_v1_pool260k_seed42
seed: 42
output_dir: data/container_state/container_state_v1_pool260k_seed42
lexicons: configs/container_state/lexicons_v1.yaml

# Preserve the same 30% source-pool headroom as the 1% experiment while
# supporting a unique 200k-word synthetic allocation without repetition.
pool_min_words: 260000

world:
  container_count_weights:
    3: 0.5
    4: 0.3
    5: 0.2
  min_items_per_container: 1
  max_items_per_container: 3
  same_type_ratio: 0.5

operations:
  count_weights:
    0: 0.5
    1: 0.5
  kind_weights:
    add: 0.333333
    remove: 0.333333
    move: 0.333334

rendering:
  training_templates:
    - household_narrative
    - inventory_report
    - cleanup_summary
    - conversational_recap
  heldout_templates:
    - storage_log
    - observational_report

validation:
  items_per_slice: 1000
  include_two_operation_slice: true
