name: material_affordance_ewok_4000_child_directed_positive
seed: 42
input_dir: data/concept_curriculum/material_affordance_ewok_4000_action_local_v3_1_soft_tap
output_dir: data/concept_curriculum/material_affordance_ewok_4000_child_directed_positive

source:
  scenario_plans: scenario_plans.jsonl
  documents: documents_audited.jsonl

selection:
  include_audit_status:
    - pass
    - warn

styles:
  - caregiver_qa
  - prediction_qa
  - what_object_qa
  - who_agent_qa
  - speaker_perspective_who_qa
  - possessive_deixis_who_qa
  - where_location_qa
  - fragment_answer
  - state_tracking_dialogue

agent_pool:
  - Mommy
  - Daddy
  - Nana
  - Grandpa
  - Mia
  - Jared
  - Sarah
  - David
  - the teacher
  - the child
  - the helper
  - the gardener
  - the mailman

deictic_agent_pool:
  - child_who_answer: my friend
    caregiver_followup_subject: your friend
  - child_who_answer: my brother
    caregiver_followup_subject: your brother
  - child_who_answer: my sister
    caregiver_followup_subject: your sister

word_count:
  pattern: "[A-Za-z0-9]+(?:['-][A-Za-z0-9]+)*"

audit:
  min_words: 8
  max_words: 90
  positive_only: true
  positive_only_markers:
    - "no"
    - "not"
    - "never"
    - "wrong"
    - "instead"
    - "rather than"
    - "as opposed to"
    - "unlike"
    - "avoid"
    - "prevent"
    - "keep from"
  require_question_mark: true
  required_speaker_tags:
    - "*MOT:"
    - "*CHI:"
  max_turns: 5
