name: qa_wherewhat_hardconfound_frames_sample500_seed42
seed: 42
document_count: 500
output_dir: data/linguistic_repair/qa_wherewhat_hardconfound_frames_sample500_seed42

# Same-event contrastive QA-easy where repair:
# where -> location/path role, what -> object/theme role.
# Exact BLIMP destination/local strings are excluded in the generator.
scenario_group_weights:
  destination_path_named: 0.15
  destination_path_common: 0.35
  object_anchored_local: 0.50

style_weights:
  bare_fragment: 0.50
  dialogue_fragment: 0.25
  bare_full_sentence: 0.25
  dialogue_full_sentence: 0.00

second_person_ratio: 0.80
where_first_ratio: 0.50

speaker_pairs:
  - [A, B]
  - [David, Sarah]
  - [Maya, Omar]
  - [Lia, Ben]
  - [Nora, Theo]
  - [Iris, Leo]
