# CONTAMINATED ORACLE DIAGNOSTIC — DO NOT USE FOR A BABYLM SUBMISSION.
name: babylm2026_strict_small_eval_copy1_gpt_bert_mixed_shards

dataset:
  kind: local_text
  files:
    - data/text_mixes/archive/babylm2026_strict_small_eval_copy1_seed42/train.txt
  split: train
  text_field: text
  document_mode: line

tokenizer:
  kind: pretrained
  source: ${BABYSTEPS_GPT_BERT_BASELINE_MIXED_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/gpt_bert_baseline_mixed}
  trust_remote_code: true
  model_max_length: 512
  output_dir: ${BABYSTEPS_GPT_BERT_BASELINE_MIXED_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/gpt_bert_baseline_mixed}

shards:
  output_dir: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_shards/babylm2026_strict_small_eval_copy1_gpt_bert_mixed
  shard_tokens: 1000000
  # Keep every leaked item in the training split. Validation reuses train below.
  val_shards: 0
  batch_docs: 512
  max_shards:
