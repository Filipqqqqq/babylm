name: babylm2026_strict_small_plus_ewok_full_correct_pairs_repeat8_byte_bpe_16384_shards

dataset:
  kind: local_text
  files:
    - data/analysis/word2vec/base_text/babylm2026_strict_small/train.txt
    - data/analysis/ewok_leakage/archive/full_ewok_correct_pairs_repeat8/train.txt
  split: train
  text_field: text
  document_mode: line

tokenizer:
  kind: pretrained
  source: ${BABYSTEPS_BABYLM2026_STRICT_SMALL_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/babylm2026_strict_small_byte_bpe_16384}
  output_dir: ${BABYSTEPS_BABYLM2026_STRICT_SMALL_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/babylm2026_strict_small_byte_bpe_16384}
  model_max_length: 1024

shards:
  output_dir: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_shards/babylm2026_strict_small_plus_ewok_full_correct_pairs_repeat8_byte_bpe_16384_bos_eos
  shard_tokens: 1000000
  val_shards: 1
  batch_docs: 512
  max_shards:
