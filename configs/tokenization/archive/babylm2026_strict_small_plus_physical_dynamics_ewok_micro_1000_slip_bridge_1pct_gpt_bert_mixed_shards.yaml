name: babylm2026_strict_small_plus_physical_dynamics_ewok_micro_1000_slip_bridge_1pct_gpt_bert_mixed_shards

dataset:
  kind: local_text
  files:
    - data/analysis/word2vec/base_text/babylm2026_strict_small/train.txt
    - data/analysis/word2vec/text_mixes/babylm2026_strict_small_plus_physical_dynamics_ewok_micro_1000_slip_bridge_1pct/synthetic_repeated.txt
  split: train
  text_field: text
  document_mode: line

tokenizer:
  kind: pretrained
  source: ${BABYSTEPS_GPT_BERT_BASELINE_MIXED_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/gpt_bert_baseline_mixed}
  trust_remote_code: true
  model_max_length: 512
  output_dir: ${BABYSTEPS_GPT_BERT_BASELINE_MIXED_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/gpt_bert_baseline_mixed}

shards:
  output_dir: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_shards/babylm2026_strict_small_plus_physical_dynamics_ewok_micro_1000_slip_bridge_1pct_gpt_bert_mixed
  shard_tokens: 1000000
  val_shards: 1
  batch_docs: 512
  max_shards:
