name: babylm2026_strict_small_gpt_bert_baseline_mixed_shards

dataset:
  name: BabyLM-community/BabyLM-2026-Strict-Small
  config: default
  split: train
  text_field: text
  streaming: true

tokenizer:
  kind: pretrained
  source: BabyLM-community/babylm-baseline-10m-gpt-bert-mixed
  trust_remote_code: true
  model_max_length: 512
  output_dir: ${BABYSTEPS_GPT_BERT_BASELINE_MIXED_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/gpt_bert_baseline_mixed}

shards:
  output_dir: ${BABYSTEPS_BABYLM2026_STRICT_SMALL_GPT_BERT_BASELINE_MIXED_SHARDS_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_shards/babylm2026_strict_small_gpt_bert_baseline_mixed}
  shard_tokens: 1000000
  val_shards: 1
  batch_docs: 512
  max_shards:
