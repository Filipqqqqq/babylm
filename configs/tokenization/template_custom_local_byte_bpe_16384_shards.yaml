# Copy this file for local text or JSONL datasets.
name: custom_local_byte_bpe_16384_shards

dataset:
  kind: local_jsonl
  files:
    train: ${BABYSTEPS_CUSTOM_TRAIN_JSONL}
  split: train
  text_field: text
  encoding: utf-8

# For plain text files, switch the dataset block to:
# dataset:
#   kind: local_text
#   files:
#     - ${BABYSTEPS_CUSTOM_TEXT_FILE}
#   text_field: text
#   document_mode: file
#   encoding: utf-8
#
# Or point at a folder of text files:
# dataset:
#   kind: local_text
#   dir: ${BABYSTEPS_CUSTOM_TEXT_DIR}
#   glob: "*.txt"
#   recursive: false
#   text_field: text
#   document_mode: file
#   encoding: utf-8

tokenizer:
  kind: byte_bpe
  vocab_size: 16384
  min_frequency: 2
  special_tokens:
    - <unk>
    - <s>
    - </s>
    - <pad>
  unk_token: <unk>
  bos_token: <s>
  eos_token: </s>
  pad_token: <pad>
  model_max_length: 1024
  train_batch_docs: 1000
  output_dir: ${BABYSTEPS_CUSTOM_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/custom_byte_bpe_16384}

shards:
  output_dir: ${BABYSTEPS_CUSTOM_SHARDS_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_shards/custom_byte_bpe_16384_bos_eos}
  shard_tokens: 1000000
  val_shards: 1
  batch_docs: 512
  max_shards:
