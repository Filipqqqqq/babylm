name: babylm10m_byte_bpe_8192_block512_eos

data:
  clean_train_dir: ${BABYSTEPS_10M_CLEAN_TRAIN_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/clean_text/babylm_10m/train}
  clean_dev_dir: ${BABYSTEPS_10M_CLEAN_DEV_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/clean_text/babylm_10m/dev}
  sources:
    - childes
    - switchboard
    - bnc_spoken
    - gutenberg
    - open_subtitles
    - simple_wiki

tokenizer:
  kind: byte_bpe
  vocab_size: 8192
  min_frequency: 2
  special_tokens:
    - <|endoftext|>
  output_dir: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/babylm10m_byte_bpe_8192

chunks:
  chunk_size: 512
  wrap_with_eos: true
  drop_remainder: true
  add_special_tokens: false
  output_dir: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_chunks/babylm10m_byte_bpe_8192_block512_eos
