name: babylm2026_strict_small_byte_bpe_16384_shards

dataset:
  name: BabyLM-community/BabyLM-2026-Strict-Small
  config: default
  split: train
  text_field: text
  streaming: true

tokenizer:
  kind: byte_bpe
  vocab_size: 16384
  min_frequency: 2
  special_tokens:
    - <unk>
    - <s>
    - </s>
    - <pad>
  unk_token: <unk>
  bos_token: <s>
  eos_token: </s>
  pad_token: <pad>
  model_max_length: 1024
  train_batch_docs: 1000
  output_dir: ${BABYSTEPS_BABYLM2026_STRICT_SMALL_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/babylm2026_strict_small_byte_bpe_16384}

shards:
  output_dir: ${BABYSTEPS_BABYLM2026_STRICT_SMALL_SHARDS_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_shards/babylm2026_strict_small_byte_bpe_16384_bos_eos}
  shard_tokens: 1000000
  val_shards: 1
  batch_docs: 512
  max_shards:
