name: babylm10m_gpt2_pretrained_block512_eos

data:
  clean_train_dir: ${BABYSTEPS_10M_CLEAN_TRAIN_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/clean_text/babylm_10m/train}
  clean_dev_dir: ${BABYSTEPS_10M_CLEAN_DEV_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/clean_text/babylm_10m/dev}
  sources:
    - childes
    - switchboard
    - bnc_spoken
    - gutenberg
    - open_subtitles
    - simple_wiki

tokenizer:
  kind: pretrained_hf
  name_or_path: gpt2

chunks:
  chunk_size: 512
  wrap_with_eos: true
  drop_remainder: true
  add_special_tokens: false
  output_dir: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_chunks/babylm10m_gpt2_pretrained_block512_eos
