name: babylm2026_strict_gpt_bert_baseline_100m_masked_focus_shards

dataset:
  name: BabyLM-community/BabyLM-2026-Strict
  config: default
  split: train
  text_field: text
  streaming: true

tokenizer:
  kind: pretrained
  source: BabyLM-community/babylm-baseline-100m-gpt-bert-masked-focus
  trust_remote_code: true
  model_max_length: 512
  output_dir: ${BABYSTEPS_GPT_BERT_BASELINE_100M_MASKED_FOCUS_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/gpt_bert_baseline_100m_masked_focus}

shards:
  output_dir: ${BABYSTEPS_BABYLM2026_STRICT_GPT_BERT_BASELINE_100M_MASKED_FOCUS_SHARDS_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_shards/babylm2026_strict_gpt_bert_baseline_100m_masked_focus}
  shard_tokens: 1000000
  val_shards: 1
  batch_docs: 512
  max_shards:
