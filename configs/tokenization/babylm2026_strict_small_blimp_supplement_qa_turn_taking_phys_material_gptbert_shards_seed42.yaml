name: babylm2026_strict_small_blimp_supplement_qa_turn_taking_phys_material_gptbert_shards_seed42

dataset:
  kind: local_text
  files:
    - data/text_mixes/babylm2026_strict_small_blimp_supplement_qa_turn_taking_phys_material_seed42/train.txt
  split: train
  text_field: text
  document_mode: line

tokenizer:
  kind: pretrained
  source: ${BABYSTEPS_GPT_BERT_BASELINE_MIXED_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/gpt_bert_baseline_mixed}
  trust_remote_code: true
  model_max_length: 512
  output_dir: ${BABYSTEPS_GPT_BERT_BASELINE_MIXED_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/gpt_bert_baseline_mixed}

shards:
  output_dir: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_shards/babylm2026_strict_small_blimp_supplement_qa_turn_taking_phys_material_gptbert
  shard_tokens: 1000000
  val_shards: 1
  batch_docs: 512
  max_shards:
