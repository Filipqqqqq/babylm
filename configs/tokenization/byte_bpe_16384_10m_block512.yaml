name: babylm10m_byte_bpe_16384_block512_eos

data:
  clean_train_dir: /SSD/tokenPred/babylm_10m/train_files/CustomLlama/data/babylm_10M_clean
  clean_dev_dir: /SSD/tokenPred/babylm_10m/train_files/CustomLlama/data/babylm_dev_clean
  sources:
    - childes
    - switchboard
    - bnc_spoken
    - gutenberg
    - open_subtitles
    - simple_wiki

tokenizer:
  kind: byte_bpe
  vocab_size: 16384
  min_frequency: 2
  special_tokens:
    - <|endoftext|>
  output_dir: /SSD2/babylm-baby-steps-cache/tokenizers/babylm10m_byte_bpe_16384

chunks:
  chunk_size: 512
  wrap_with_eos: true
  drop_remainder: true
  add_special_tokens: false
  output_dir: /SSD2/babylm-baby-steps-cache/token_chunks/babylm10m_byte_bpe_16384_block512_eos
