name: babylm2026_strict_small_local_control_seed42
seed: 42
order_seed: 1
max_words: 10000000
strict_max_words: true
document_mode: line
final_order: deterministic_document_shuffle
trim_policy: trim_final_document_only_if_needed
output_dir: data/text_mixes/babylm2026_strict_small_local_control_seed42

word_count:
  kind: regex
  pattern: '\S+'

sources:
  - name: babylm2026_strict_small
    role: base
    path: data/analysis/word2vec/base_text/babylm2026_strict_small/train.txt
    target_words: 10000000
    sampling: random_without_replacement
