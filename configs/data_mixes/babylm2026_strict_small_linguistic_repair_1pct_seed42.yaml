name: babylm2026_strict_small_linguistic_repair_1pct_seed42
seed: 42
order_seed: 1
max_words: 10000000
strict_max_words: true
document_mode: line
final_order: deterministic_document_shuffle
trim_policy: trim_final_document_only_if_needed
output_dir: data/text_mixes/babylm2026_strict_small_linguistic_repair_1pct_seed42

# Use whitespace words, matching the BabyLM word-budget interpretation and the
# standalone 1.5% linguistic-repair text mix. The five repair allocations are
# the 1.5% recipe scaled from 150,000 to 100,000 synthetic words.
word_count:
  kind: regex
  pattern: '\S+'

sources:
  - name: babylm2026_strict_small
    role: base
    path: data/analysis/word2vec/base_text/babylm2026_strict_small/train.txt
    target_words: 9900000
    sampling: random_without_replacement
  - name: qa_congruence_repair_original_roles
    role: synthetic
    path: data/linguistic_repair/qa_congruence_qwen3p7plus_roles_sample1000_seed42/train.txt
    target_words: 33333
    sampling: repeat_then_partial
  - name: qa_turntaking_pronoun_frames
    role: synthetic
    path: data/linguistic_repair/qa_turntaking_pronoun_frames_50k_seed42/train.txt
    target_words: 33333
    sampling: repeat_then_partial
  - name: qa_where_destination_frames
    role: synthetic
    path: data/linguistic_repair/qa_where_destination_frames_named_secondperson_sample500_seed42/train.txt
    target_words: 10000
    sampling: repeat_then_partial
  - name: qa_where_local_prep_frames
    role: synthetic
    path: data/linguistic_repair/qa_where_local_prep_frames_sample500_seed42/train.txt
    target_words: 6667
    sampling: repeat_then_partial
  - name: qa_who_common_name_frames
    role: synthetic
    path: data/linguistic_repair/qa_who_common_name_frames_sample500_seed42/train.txt
    target_words: 16667
    sampling: repeat_then_partial
