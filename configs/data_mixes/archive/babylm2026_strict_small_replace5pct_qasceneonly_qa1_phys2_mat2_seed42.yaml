name: babylm2026_strict_small_replace5pct_qasceneonly_qa1_phys2_mat2_seed42
seed: 42
max_words: 10000000
strict_max_words: true
document_mode: line
final_order: deterministic_document_shuffle
trim_policy: trim_final_document_only_if_needed
output_dir: data/text_mixes/babylm2026_strict_small_replace5pct_qasceneonly_qa1_phys2_mat2_seed42

word_count:
  kind: regex
  pattern: "[A-Za-z0-9]+(?:['-][A-Za-z0-9]+)*"

sources:
  - name: babylm2026_strict_small
    role: base
    path: data/analysis/word2vec/base_text/babylm2026_strict_small/train.txt
    target_words: 9500000
    sampling: random_without_replacement
  - name: qa_congruence_repair_scene_only
    role: synthetic
    path: data/linguistic_repair/qa_congruence_qwen3p7plus_scene_only_sample2500_seed42/train.txt
    target_words: 100000
    sampling: repeat_then_partial
  - name: physical_dynamics_slip_bridge
    role: synthetic
    path: data/concept_curriculum/physical_dynamics_ewok_micro_1000_slip_bridge_qwen/train.txt
    target_words: 200000
    sampling: repeat_then_partial
  - name: material_affordance
    role: synthetic
    path: data/concept_curriculum/material_affordance_ewok_4000_action_local_v3_1_soft_tap/train.txt
    target_words: 200000
    sampling: repeat_then_partial
