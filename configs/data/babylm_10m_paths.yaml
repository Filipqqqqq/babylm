name: babylm_10m

raw:
  train_dir: ${BABYLM_10M_RAW_TRAIN_DIR:-~/babylm-data/babylm_10M}
  dev_dir: ${BABYLM_10M_RAW_DEV_DIR:-~/babylm-data/babylm_dev}

clean:
  train_dir: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/clean_text/babylm_10m/train
  dev_dir: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/clean_text/babylm_10m/dev
  manifest_path: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/clean_text/babylm_10m/manifest.json

sources:
  - bnc_spoken
  - childes
  - gutenberg
  - open_subtitles
  - simple_wiki
  - switchboard

cleaning:
  seq_length: 128
  encoding: utf-8
  overwrite: true
