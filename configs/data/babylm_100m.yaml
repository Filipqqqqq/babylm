dataset:
  name: babylm_100m
  split: train
  description: BabyLM Challenge 100M training corpus.

paths:
  raw_data_dir: ${BABYSTEPS_RAW_DATA_DIR}
  processed_dir: ${BABYSTEPS_PROCESSED_DIR}/babylm_100m

corpora:
  - name: gutenberg
    file: gutenberg.train
  - name: switchboard
    file: switchboard.train
  - name: bnc_spoken
    file: bnc_spoken.train
  - name: childes
    file: childes.train
  - name: simple_wiki
    file: simple_wiki.train
  - name: open_subtitles
    file: open_subtitles.train

processing:
  tokenizer: gpt2
  block_size: 512
  append_eos: true
  validation_fraction: 0.02
  seed: 42

outputs:
  train_chunks: ${BABYSTEPS_PROCESSED_DIR}/babylm_100m/gpt2_block512_train.pkl
  val_chunks: ${BABYSTEPS_PROCESSED_DIR}/babylm_100m/gpt2_block512_val.pkl
