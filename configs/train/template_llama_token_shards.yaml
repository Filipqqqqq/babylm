# Copy this file and point the data/tokenizer paths at generated token shards.
run:
  name: custom_llama_8l512_bpe16384_muon
  seed: 42
  deterministic: false
  output_root: ${BABYSTEPS_RUNS_DIR:-~/babylm-baby-steps-runs}/training
  append_timestamp: true

data:
  format: token_shards
  data_dir: ${BABYSTEPS_CUSTOM_SHARDS_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_shards/custom_byte_bpe_16384_bos_eos}
  train_split: train
  val_split: val
  seq_len: 1024
  max_train_blocks:
  max_val_blocks:
  num_workers: 0

tokenizer:
  name: ${BABYSTEPS_CUSTOM_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/custom_byte_bpe_16384}

model:
  architecture: llama
  size: 8l512
  vocab_size: 16384
  context_length: 1024
  n_layer: 8
  n_head: 8
  n_embd: 512
  llama_intermediate_size: 1280
  llama_num_key_value_heads: 8
  llama_tie_word_embeddings: true
  rope_theta: 10000.0
  attention_dropout: 0.0
  use_liger_kernel: false

training:
  epochs: 10
  batch_size: 16
  optimizer: muon_pe
  learning_rate: 0.00005
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.1
  muon_lr: 0.01
  muon_weight_decay: 0.1
  muon_momentum: 0.95
  muon_ns_steps: 5
  muon_nesterov: true
  muon_split_qkv: true
  muon_batch_updates: true
  warmup_ratio: 0.03
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  mixed_precision: bf16

logging:
  log_every_steps: 50
  eval_every_steps: 500
  eval_max_batches: 20
  profile_optimizer_steps: true

checkpointing:
  save_every_epochs: 1
  save_final: true
