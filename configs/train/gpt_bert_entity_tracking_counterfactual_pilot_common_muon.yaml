# Common recipe for all four entity-tracking counterfactual pilot arms.
# The queue worker overrides data.data_dir and spatial_auxiliary for each arm.
run:
  name: entity_tracking_counterfactual_pilot
  seed: 42
  deterministic: false
  output_root: ${BABYSTEPS_RUNS_DIR:-~/babylm-baby-steps-runs}/training
  append_timestamp: false

data:
  format: token_shards
  data_dir: ${BABYSTEPS_BABYLM2026_STRICT_SMALL_GPT_BERT_BASELINE_MIXED_SHARDS_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_shards/babylm2026_strict_small_gpt_bert_baseline_mixed}
  train_split: train
  val_split: val
  seq_len: 512
  max_train_blocks:
  max_val_blocks:
  num_workers: 0

tokenizer:
  name: ${BABYSTEPS_GPT_BERT_BASELINE_MIXED_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/gpt_bert_baseline_mixed}
  trust_remote_code: true

model:
  architecture: gpt_bert
  repo: BabyLM-community/babylm-baseline-10m-gpt-bert-mixed
  context_length: 512

hybrid:
  causal_steps: 1
  masked_steps: 1
  mask_start: 0.30
  mask_end: 0.15
  random_ratio: 0.10
  keep_ratio: 0.10
  z_loss: 0.0001

progress:
  benchmark_plot_x_axis: words_seen
  estimate_words_per_token: true
  words_per_token_sample_tokens: 4096

# Expensive benchmarks run once after training, custom first, in the queue
# worker. This avoids repeatedly testing on the co-primary benchmarks.
ewok_context_sensitivity_full:
  enabled: false

ewok_mntp_context_sensitivity:
  enabled: false

mntp_likelihood:
  enabled: false

loss_dynamics:
  plot: false

spatial_auxiliary:
  enabled: false
  objective: completion_rank
  path: data/container_state/container_state_counterfactual_v2_seed42/auxiliary/train_completion_rank.jsonl
  eval_path: data/container_state/container_state_counterfactual_v2_seed42/auxiliary/eval_completion_rank.jsonl
  batch_size: 32
  loss_weight: 0.03
  temperature: 1.0
  score_reduction: mean
  every_steps: 1
  # When set by a follow-up arm, this counts causal updates only and takes
  # precedence over every_steps. V3 completion ranking will use 5.
  every_causal_steps:
  apply_on: causal
  eval_every_steps: 1000
  eval_batch_size: 64
  eval_at_start: true

training:
  epochs: 10
  batch_size: 32
  optimizer: muon_pe
  learning_rate: 0.001
  betas: [0.9, 0.999]
  eps: 0.00000001
  weight_decay: 0.0
  muon_lr: 0.01
  muon_weight_decay: 0.1
  muon_momentum: 0.95
  muon_ns_steps: 5
  muon_nesterov: true
  muon_split_qkv: false
  muon_batch_updates: true
  warmup_ratio: 0.03
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  mixed_precision: bf16

logging:
  log_every_steps: 50
  eval_every_steps: 1000
  eval_max_batches: 20
  benchmark_eval_at_start: false

checkpointing:
  save_every_epochs: 1
  save_final: true
