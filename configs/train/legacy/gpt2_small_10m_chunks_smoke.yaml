# Legacy BabyLM 10M GPT-2 chunk smoke config.
#
# This requires prebuilt GPT-2 token chunks at:
#   ${BABYSTEPS_CACHE_DIR}/token_chunks/babylm10m_gpt2_pretrained_block512_eos
#
# For the current runnable smoke path, use:
#   configs/train/smoke/gpt2_bpe16384_babylm2026_strict_small_smoke.yaml

run:
  name: gpt2_small_10m_chunks_smoke
  seed: 42
  deterministic: false
  output_root: ${BABYSTEPS_RUNS_DIR:-~/babylm-baby-steps-runs}/training
  append_timestamp: true

data:
  train_chunks: ${BABYSTEPS_10M_GPT2_CHUNKS_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_chunks/babylm10m_gpt2_pretrained_block512_eos}/train.pkl
  val_chunks: ${BABYSTEPS_10M_GPT2_CHUNKS_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_chunks/babylm10m_gpt2_pretrained_block512_eos}/dev.pkl
  max_train_chunks:
  max_val_chunks:
  num_workers: 0

tokenizer:
  name: gpt2

model:
  architecture: gpt2
  size: small
  vocab_size: 50257
  context_length: 1024
  n_layer: 12
  n_head: 12
  n_embd: 768
  resid_pdrop: 0.1
  embd_pdrop: 0.1
  attn_pdrop: 0.1

training:
  epochs: 1
  batch_size: 16
  learning_rate: 0.00005
  betas: [0.9, 0.999]
  eps: 0.00000001
  weight_decay: 0.0
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  gradient_clip_norm:
  mixed_precision: "no"

logging:
  log_every_steps: 50
  eval_every_steps: 250
  eval_max_batches: 20

checkpointing:
  save_every_epochs: 1
  save_final: true
