run:
  name: gpt2_small_10m_smoke
  seed: 42
  deterministic: false
  output_root: /SSD2/babylm-baby-steps-runs/training
  append_timestamp: true

data:
  train_chunks: /SSD/tokenPred/babylm_10m/train_files/CustomLlama/data/babylm_10M_clean/bbylm_agentic_mixed.pkl
  val_chunks: /SSD/tokenPred/babylm_10m/train_files/CustomLlama/data/babylm_dev_clean/babylm_dev_data.pkl
  max_train_chunks:
  max_val_chunks:
  num_workers: 0

tokenizer:
  name: gpt2

model:
  architecture: gpt2
  size: small
  vocab_size: 50257
  context_length: 1024
  n_layer: 12
  n_head: 12
  n_embd: 768
  resid_pdrop: 0.1
  embd_pdrop: 0.1
  attn_pdrop: 0.1

training:
  epochs: 1
  batch_size: 16
  learning_rate: 0.00005
  betas: [0.9, 0.999]
  eps: 0.00000001
  weight_decay: 0.0
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  gradient_clip_norm:
  mixed_precision: "no"

logging:
  log_every_steps: 50
  eval_every_steps: 250
  eval_max_batches: 20

checkpointing:
  save_every_epochs: 1
  save_final: true
