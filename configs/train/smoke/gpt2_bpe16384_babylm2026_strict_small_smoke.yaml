run:
  name: gpt2_bpe16384_babylm2026_strict_small_smoke
  seed: 42
  deterministic: false
  output_root: ${BABYSTEPS_RUNS_DIR:-~/babylm-baby-steps-runs}/training
  append_timestamp: true

data:
  format: token_shards
  data_dir: ${BABYSTEPS_BABYLM2026_STRICT_SMALL_SHARDS_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_shards/babylm2026_strict_small_byte_bpe_16384_bos_eos}
  train_split: train
  val_split: val
  seq_len: 1024
  max_train_blocks: 32
  max_val_blocks: 4
  num_workers: 0

tokenizer:
  name: ${BABYSTEPS_BABYLM2026_STRICT_SMALL_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/babylm2026_strict_small_byte_bpe_16384}

model:
  architecture: gpt2
  size: tiny
  vocab_size: 16384
  context_length: 1024
  n_layer: 4
  n_head: 4
  n_embd: 256
  resid_pdrop: 0.1
  embd_pdrop: 0.1
  attn_pdrop: 0.1

training:
  epochs: 1
  batch_size: 8
  learning_rate: 0.00005
  betas: [0.9, 0.999]
  eps: 0.00000001
  weight_decay: 0.0
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  gradient_clip_norm:
  mixed_precision: "no"

logging:
  log_every_steps: 10
  eval_every_steps: 16
  eval_max_batches: 4

checkpointing:
  save_every_epochs: 1
  save_final: true
