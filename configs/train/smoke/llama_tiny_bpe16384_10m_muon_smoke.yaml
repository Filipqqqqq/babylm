run:
  name: llama_tiny_bpe16384_10m_muon_smoke
  seed: 42
  deterministic: false
  output_root: ${BABYSTEPS_RUNS_DIR:-~/babylm-baby-steps-runs}/training
  append_timestamp: true

data:
  train_chunks: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_chunks/babylm10m_byte_bpe_16384_block512_eos/train.pkl
  val_chunks: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/token_chunks/babylm10m_byte_bpe_16384_block512_eos/dev.pkl
  max_train_chunks: 512
  max_val_chunks: 128
  num_workers: 0

tokenizer:
  name: ${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/babylm10m_byte_bpe_16384

model:
  architecture: llama
  size: tiny
  vocab_size: 16384
  context_length: 1024
  n_layer: 4
  n_head: 4
  n_embd: 256
  llama_intermediate_size: 1024
  llama_num_key_value_heads: 4
  llama_tie_word_embeddings: true
  rope_theta: 10000.0
  attention_dropout: 0.0

training:
  epochs: 1
  batch_size: 8
  optimizer: muon_pe
  learning_rate: 0.00005
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.1
  muon_lr: 0.02
  muon_weight_decay: 0.1
  muon_momentum: 0.95
  muon_ns_steps: 5
  muon_nesterov: true
  muon_split_qkv: true
  muon_batch_updates: true
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  mixed_precision: "no"

logging:
  log_every_steps: 10
  eval_every_steps: 25
  eval_max_batches: 10
  profile_optimizer_steps: true

checkpointing:
  save_every_epochs: 1
  save_final: true
