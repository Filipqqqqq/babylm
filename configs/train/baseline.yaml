run:
  name: babylm_100m_gpt2_baseline
  seed: 42
  output_dir: ${BABYSTEPS_RUNS_DIR}/training/babylm_100m_gpt2_baseline

data:
  config: configs/data/babylm_100m.yaml
  batch_size: 16
  num_workers: 4

model:
  architecture: gpt2
  size: small
  tokenizer: gpt2
  context_length: 512

training:
  epochs: 10
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 1000
  gradient_accumulation_steps: 1
  mixed_precision: bf16

checkpointing:
  save_every_steps: 1000
  keep_last: 3

logging:
  log_every_steps: 50
  eval_every_steps: 1000
