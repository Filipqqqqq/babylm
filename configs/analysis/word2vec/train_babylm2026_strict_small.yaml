name: babylm2026_strict_small_word2vec

dataset:
  name: BabyLM-community/BabyLM-2026-Strict-Small
  config: default
  split: train
  text_field: text
  streaming: true

preprocessing:
  lowercase: true
  split_sentences: true
  min_token_length: 1

word2vec:
  vector_size: 300
  window: 5
  min_count: 5
  sg: 1
  negative: 10
  epochs: 5
  workers: 4
  seed: 13
  sample: 0.001
  hs: 0

output:
  dir: ${BABYSTEPS_RUNS_DIR:-~/babylm-baby-steps-runs}/analysis/word2vec/babylm2026_strict_small
  timestamp: true
