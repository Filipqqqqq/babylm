name: material_affordance_ewok_4000_word2vec

dataset:
  kind: local_text
  path: data/concept_curriculum/material_affordance_ewok_4000_action_local_v3_1_soft_tap/train.txt
  text_field: text
  document_mode: line
  skip_empty: true

preprocessing:
  lowercase: true
  split_sentences: true
  min_token_length: 1

word2vec:
  vector_size: 100
  window: 5
  min_count: 1
  sg: 1
  negative: 10
  epochs: 50
  workers: 4
  seed: 13
  sample: 0.001
  hs: 0

output:
  dir: ${BABYSTEPS_RUNS_DIR:-~/babylm-baby-steps-runs}/analysis/word2vec/material_affordance_ewok_4000
  timestamp: false
