name: babylm2026_strict_small_ewok_lexical

dataset:
  name: BabyLM-community/BabyLM-2026-Strict-Small
  config: default
  split: train
  text_field: text
  streaming: true

tokenizer:
  path: ${BABYSTEPS_BABYLM2026_STRICT_SMALL_TOKENIZER_DIR:-${BABYSTEPS_CACHE_DIR:-~/babylm-baby-steps-cache}/tokenizers/babylm2026_strict_small_byte_bpe_16384}

targets:
  path: configs/analysis/targets/ewok_fast_lexical_targets.yaml

lemmatizer:
  kind: spacy
  model: en_core_web_sm
  batch_size: 64
  n_process: 4
  disable:
    - ner

analysis:
  source_field: source
  neighbor_window: 5
  context_word_radius: 20
  examples_per_target: 10
  seed: 13
  tokenizer_mode: leading_space
  filter_context_neighbor_stopwords: true
  min_frequency_for_fragmented: 1
  progress_logging: true
  progress_interval_docs: 10000
  progress_interval_seconds: 30

output:
  dir: ${BABYSTEPS_RUNS_DIR:-~/babylm-baby-steps-runs}/analysis/lexical/babylm2026_strict_small_ewok
  timestamp: true
