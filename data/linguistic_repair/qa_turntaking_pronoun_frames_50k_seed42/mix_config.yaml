name: qa_turntaking_pronoun_frames_50k_seed42
seed: 42
max_words: 50000
strict_max_words: true
document_mode: line
final_order: deterministic_document_shuffle
trim_policy: trim_final_document_only_if_needed
output_dir: data/linguistic_repair/qa_turntaking_pronoun_frames_50k_seed42

word_count:
  kind: regex
  pattern: "[A-Za-z0-9]+(?:['-][A-Za-z0-9]+)*"

sources:
  - name: qa_turntaking_pronoun_frames_pool
    role: synthetic
    path: data/linguistic_repair/qa_turntaking_pronoun_frames_pool5000_seed42/train.txt
    target_words: 50000
    sampling: random_without_replacement_exact_words
